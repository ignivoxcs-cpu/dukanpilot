# Render Blueprint — lets Render set up DukaanPilot automatically.
# In Render: New → Blueprint → pick this GitHub repository.
services:
  - type: web
    name: dukaanpilot
    runtime: node
    plan: free # Free: sleeps after 15 min idle, takes ~1 min to wake up.
    region: singapore # closest Render region to India
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # redeploys whenever new code is pushed to GitHub
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase keys are added in Phase 2 — in Render's dashboard, never in this file.
